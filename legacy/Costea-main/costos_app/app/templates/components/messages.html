{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="alert alert-{{ category }}" role="{{ 'alert' if category == 'danger' else 'status' }}">
      <i class="bi {{ 'bi-exclamation-circle' if category == 'danger' else 'bi-info-circle' }}" aria-hidden="true"></i>
      {{ message }}
    </div>
  {% endfor %}
{% endwith %}
