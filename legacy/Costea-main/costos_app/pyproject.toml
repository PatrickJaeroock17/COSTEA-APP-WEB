[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keep test databases away from Windows temporary directories with stale permissions.
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]
